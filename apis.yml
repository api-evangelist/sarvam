aid: sarvam
name: Sarvam
description: >-
  Sarvam AI is an Indian-language AI platform offering a unified REST and
  WebSocket API across speech-to-text (Saaras / Saarika), text-to-speech
  (Bulbul, 30+ voices), translation and transliteration (Mayura /
  Sarvam-Translate) for 22 Indian languages, multilingual chat completion
  (Sarvam-30B and Sarvam-105B, OpenAI-compatible), and document digitization
  (Sarvam Vision). The API is authenticated with an api-subscription-key header,
  billed in Indian Rupees with ₹100 free credits on signup, and shipped with
  official Python and JavaScript SDKs, published OpenAPI and AsyncAPI specs, a
  documentation MCP server, a status page, and a dated changelog. Sarvam is
  backed by Bessemer Venture Partners.
