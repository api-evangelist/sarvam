      enum:
        - linear16
        - mulaw
        - alaw
        - opus
        - flac
        - aac
        - wav
        - mp3
      default: mp3
      description: Audio codec (currently supports MP3 only, optimized for real-time playback)
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioCodec
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioBitrate:
      type: string
      enum:
        - 32k
        - 64k
        - 96k
        - 128k
        - 192k
      default: 128k
      description: Audio bitrate (choose from 5 supported bitrate options)
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioBitrate
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionData:
      type: object
      properties:
        model:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataModel'
          default: bulbul:v2
          description: |
            Specifies the model to use for text-to-speech conversion.
            - **bulbul:v2** (default): Standard TTS model with pitch/loudness support
            - **bulbul:v3**: Advanced model with temperature control (no pitch/loudness)
        target_language_code:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataTargetLanguageCode'
          description: The language of the text in BCP-47 format
        speaker:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeaker'
          description: >
            The speaker voice to be used for the output audio.


            **Default:** shubh (for bulbul:v3), anushka (for bulbul:v2)


            **Model Compatibility (Speakers compatible with respective model):**

            - **bulbul:v3:** shubh (default), aditya, ritu, priya, neha, rahul, pooja, rohan, simran, kavya, amit, dev,
            ishita, shreya, ratan, varun, manan, sumit, roopa, kabir, aayan, ashutosh, advait, anand, tanya, tarun,
            sunny, mani, gokul, vijay, shruti, suhani, mohit, kavitha, rehan, soham, rupali

            - **bulbul:v2:**
              - Female: anushka (default), manisha, vidya, arya
              - Male: abhilash, karun, hitesh

            **Note:** Speaker selection must match the chosen model version.


            **Important:** Speaker names are case-sensitive and must be lowercase (e.g., `ritu` not `Ritu`).
        pitch:
          type: number
          format: double
          default: 0
          description: |
            Controls the pitch of the audio. Lower values result in a deeper voice, 
            while higher values make it sharper. The suitable range is between -0.75 
            and 0.75. Default is 0.0.

            **Note:** NOT supported for bulbul:v3. Will be ignored if provided.
        pace:
          type: number
          format: double
          default: 1
          description: |
            Controls the speed of the audio. Lower values result in slower speech, 
            while higher values make it faster. Default is 1.0.

            **Model-specific ranges:**
            - **bulbul:v2:** 0.3 to 3.0
            - **bulbul:v3:** 0.5 to 2.0
        loudness:
          type: number
          format: double
          default: 1
          description: |
            Controls the loudness of the audio. Lower values result in quieter audio, 
            while higher values make it louder. The suitable range is between 0.3 
            and 3.0. Default is 1.0.

            **Note:** NOT supported for bulbul:v3. Will be ignored if provided.
        temperature:
          type: number
          format: double
          default: 0.6
          description: |
            Controls the randomness of the output. Lower values make the output more 
            focused and deterministic, while higher values make it more random. 
            The suitable range is between 0.01 and 1.0. Default is 0.6.

            **Note:** Only supported for bulbul:v3. Will be ignored for bulbul:v2.
        speech_sample_rate:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeechSampleRate'
          default: 22050
          description: |
            Specifies the sample rate of the output audio. Supported values are 
            8000, 16000, 22050, 24000 Hz.

            **Model-specific defaults:**
            - **bulbul:v2:** 22050 Hz
            - **bulbul:v3:** 24000 Hz
        enable_preprocessing:
          type: boolean
          default: false
          description: |
            Controls whether normalization of English words and numeric entities 
            (e.g., numbers, dates) is performed. Set to true for better handling 
            of mixed-language text.

            **Model-specific defaults:**
            - **bulbul:v2:** false (optional)
            - **bulbul:v3:** Always enabled (cannot be disabled)
        output_audio_codec:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioCodec'
          default: mp3
          description: Audio codec (currently supports MP3 only, optimized for real-time playback)
        output_audio_bitrate:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioBitrate'
          default: 128k
          description: Audio bitrate (choose from 5 supported bitrate options)
        dict_id:
          type: string
          description: |
            The ID of a pronunciation dictionary to apply during synthesis. 
            When provided, matching words in the input text will be replaced 
            with their custom pronunciations before generating speech.

            Create and manage dictionaries via the `/text-to-speech/pronunciation-dictionary` endpoints.

            **Note:** Only supported by **bulbul:v3**.
        min_buffer_size:
          type: integer
          default: 50
          description: Minimum character length that triggers buffer flushing for TTS model processing
        max_chunk_length:
          type: integer
          default: 150
          description: Maximum length for sentence splitting (adjust based on content length)
      required:
        - target_language_code
        - speaker
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionData
    textToSpeechStreaming_ConfigureConnection:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionType'
        data:
          $ref: '#/components/schemas/ChannelsTextToSpeechStreamingMessagesConfigureConnectionData'
      required:
        - type
        - data
      description: >
        Configuration message required as the first message after establishing the WebSocket connection. 

        This initializes TTS parameters and can be updated at any time during the WebSocket lifecycle 

        by sending a new config message. When a config update is sent, any text currently in the buffer 

        will be automatically flushed and processed before applying the new configuration.


        **Model-Specific Notes:**

        - **bulbul:v2:** Supports pitch, loudness, pace (0.3-3.0). Default sample rate: 22050 Hz.

        - **bulbul:v3:** Does NOT support pitch/loudness. Pace range: 0.5-2.0. Supports temperature. Default sample
        rate: 24000 Hz.
      title: textToSpeechStreaming_ConfigureConnection
    ChannelsTextToSpeechStreamingMessagesSendTextType:
      type: string
      enum:
        - text
      title: ChannelsTextToSpeechStreamingMessagesSendTextType
    ChannelsTextToSpeechStreamingMessagesSendTextData:
      type: object
      properties:
        text:
          type: string
      required:
        - text
      title: ChannelsTextToSpeechStreamingMessagesSendTextData
    textToSpeechStreaming_SendText:
