    ChannelsTextToSpeechStreamingMessagesConfigureConnectionType:
      type: string
      enum:
        - config
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionType
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataModel:
      type: string
      enum:
        - bulbul:v2
        - bulbul:v3
      default: bulbul:v2
      description: |
        Specifies the model to use for text-to-speech conversion.
        - **bulbul:v2** (default): Standard TTS model with pitch/loudness support
        - **bulbul:v3**: Advanced model with temperature control (no pitch/loudness)
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataModel
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataTargetLanguageCode:
      type: string
      enum:
        - bn-IN
        - en-IN
        - gu-IN
        - hi-IN
        - kn-IN
        - ml-IN
        - mr-IN
        - od-IN
        - pa-IN
        - ta-IN
        - te-IN
      description: The language of the text in BCP-47 format
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataTargetLanguageCode
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeaker:
      type: string
      enum:
        - anushka
        - abhilash
        - manisha
        - vidya
        - arya
        - karun
        - hitesh
        - aditya
        - ritu
        - priya
        - neha
        - rahul
        - pooja
        - rohan
        - simran
        - kavya
        - amit
        - dev
        - ishita
        - shreya
        - ratan
        - varun
        - manan
        - sumit
        - roopa
        - kabir
        - aayan
        - shubh
        - ashutosh
        - advait
        - anand
        - tanya
        - tarun
        - sunny
        - mani
        - gokul
        - vijay
        - shruti
        - suhani
        - mohit
        - kavitha
        - rehan
        - soham
        - rupali
      default: anushka
      description: >
        The speaker voice to be used for the output audio.


        **Default:** shubh (for bulbul:v3), anushka (for bulbul:v2)


        **Model Compatibility (Speakers compatible with respective model):**

        - **bulbul:v3:** shubh (default), aditya, ritu, priya, neha, rahul, pooja, rohan, simran, kavya, amit, dev,
        ishita, shreya, ratan, varun, manan, sumit, roopa, kabir, aayan, ashutosh, advait, anand, tanya, tarun, sunny,
        mani, gokul, vijay, shruti, suhani, mohit, kavitha, rehan, soham, rupali

        - **bulbul:v2:**
          - Female: anushka (default), manisha, vidya, arya
          - Male: abhilash, karun, hitesh

        **Note:** Speaker selection must match the chosen model version.


        **Important:** Speaker names are case-sensitive and must be lowercase (e.g., `ritu` not `Ritu`).
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeaker
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeechSampleRate:
      type: string
      enum:
        - '8000'
        - '16000'
        - '22050'
        - '24000'
      description: |
        Specifies the sample rate of the output audio. Supported values are 
        8000, 16000, 22050, 24000 Hz.

        **Model-specific defaults:**
        - **bulbul:v2:** 22050 Hz
        - **bulbul:v3:** 24000 Hz
      title: ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataSpeechSampleRate
    ChannelsTextToSpeechStreamingMessagesConfigureConnectionDataOutputAudioCodec:
