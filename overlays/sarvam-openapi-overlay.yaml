overlay: 1.0.0
info:
  title: API Evangelist enhancements for Sarvam AI
  version: 1.0.0
extends: openapi/sarvam-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: sarvam
    x-apievangelist-category: ai-ml
    x-apievangelist-products:
    - speech-to-text
    - text-to-speech
    - translation
    - transliteration
    - chat-completion
    - document-digitization
    x-apievangelist-languages: 22 Indian languages + English
    x-apievangelist-auth: api-subscription-key header (HTTP bearer also accepted)
    x-apievangelist-streaming: websocket (see asyncapi/sarvam-streaming-asyncapi.yaml)
    x-apievangelist-status-page: https://status.sarvam.ai
    x-apievangelist-changelog: https://docs.sarvam.ai/api/getting-started/changelog
- target: $.info
  update:
    x-apievangelist-error-envelope: '{ "error": { "message", "code" } }'
    x-apievangelist-auth-failure-status: 403
